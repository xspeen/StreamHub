name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app (simulator, unsigned)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen --project ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/StreamHub.xcodeproj \
            -scheme StreamHub \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-iOS-${{ github.run_number }}
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/StreamHub.app
          if-no-files-found: warn
