name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0 (leave empty to use the version in build.gradle.kts)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: ver
        run: |
          V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "$V" ]; then
            IFS='.' read -r MA MI PA <<< "$V"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
            echo "code=$CODE" >> "$GITHUB_OUTPUT"
            echo "Building StreamHub $V (versionCode $CODE)"
          else
            echo "Building with the version declared in app/build.gradle.kts"
          fi

      - name: Build release APK
        run: |
          ARGS=""
          if [ -n "${{ steps.ver.outputs.version }}" ]; then
            ARGS="-PversionName=${{ steps.ver.outputs.version }} -PversionCode=${{ steps.ver.outputs.code }}"
          fi
          ./gradlew :app:assembleRelease --stacktrace $ARGS

      - name: Collect release APK and source
        run: |
          VER="${{ steps.ver.outputs.version }}"
          [ -n "$VER" ] || VER="${GITHUB_RUN_NUMBER}"
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} "release-artifacts/StreamHub-$VER.apk" \;
          git archive --format=zip --prefix="StreamHub-$VER/" \
            -o "release-artifacts/StreamHub-$VER-src.zip" HEAD
          (cd release-artifacts && sha256sum *.apk *.zip > SHA256SUMS.txt)
          ls -lh release-artifacts
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload release files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-release
          path: release-artifacts/*
          if-no-files-found: error

      - name: Verify release APK signature
        run: |
          APK=$(ls release-artifacts/*.apk)
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ ! -x "$APKSIGNER" ]; then
            SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null
            APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify "$APK"
          # Check the JAR signature too by verifying against API 23.
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 "$APK" | tee apk-signature.txt
          if ! grep -q "Verified using v1 scheme (JAR signing): true" apk-signature.txt; then
            echo "::error::Release APK is missing the v1 JAR signature."
            exit 1
          fi
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt; then
            echo "::error::Release APK is missing the v2 signature."
            exit 1
          fi
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" apk-signature.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          EXPECTED="1a264afc0cd58656eae8268b837cfa6847fcfae4787104312fe683c45a39bf3f"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release APK is signed with the wrong key ($ACTUAL)."
            exit 1
          fi
          echo "Release APK is signed with the StreamHub release key."

      - name: Verify web app assets inside the APK
        run: |
          APK=$(ls release-artifacts/*.apk)
          LISTING=$(unzip -l "$APK")
          for asset in assets/splash.html assets/landing.html assets/app.html; do
            if ! echo "$LISTING" | grep -q "$asset"; then
              echo "::error::APK is missing $asset"
              exit 1
            fi
            echo "Found $asset"
          done

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            StreamHub ${{ github.ref_name }}

            Built automatically by GitHub Actions from the source at this tag.

            What's new in 1.0.1:
            - True full-screen: the app now runs edge-to-edge with the status and navigation bars hidden, so the StreamHub pages fill the entire display exactly like VidVibe (swipe from an edge to reveal the bars briefly)
            - Channel list loading fixed: the full playlist is 2.6 MB and the old 30-second limit aborted it halfway on slower mobile connections, leaving the grid empty. Each attempt now gets 2 minutes and is retried automatically before the error state appears
            - All original splash, landing and streamer pages, logos, layouts and design kept exactly as designed

            Earlier releases:
            - 1.0.0 first release: cross-platform live TV app built on the StreamHub splash, landing and streamer pages, pixel-for-pixel as designed, with HLS live playback, DStv/GOtv/global channel packages, phone/tablet/Android TV support and D-pad navigation

            Assets:
            - `StreamHub-<version>.apk` - universal Android release build (phones, tablets, Android TV)
            - `SHA256SUMS.txt` - checksums for verifying the downloads
            - `StreamHub-<version>-src.zip` - full source tree at this tag

            Install: download the APK to your device and open it (allow installs from unknown sources). On Android TV, copy the APK to the device or sideload it with `adb install`.

            Requirements: Android 7.0 (API 24) or newer, internet connection for live streams.

            If Android reports "problem parsing the package" or "app not installed", check that the
            downloaded file size matches `SHA256SUMS.txt` - a cut-off download is the most common
            cause. If Android reports a signature error while updating, uninstall the previous
            StreamHub build first.

            iOS: build instructions live in the repository (`ios/` uses XcodeGen).

            StreamHub is free and open source under the MIT License.
